[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-hardening-review"
version = "1.0.2"
description = "Offline read-only review of declared PE mitigation flags"
readme = "项目文档/README.md"
requires-python = ">=3.10"
license = {file = "项目文档/LICENSE"}
authors = [{name = "dhtfish-98"}]
dependencies = []

[project.scripts]
pe-hardening-review = "pe_hardening_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["项目文档/LICENSE"]
