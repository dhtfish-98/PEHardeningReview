[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-hardening-review"
version = "1.0.0"
description = "Offline read-only review of declared PE mitigation flags"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "dhtfish-98"}]
dependencies = []

[project.scripts]
pe-hardening-review = "pe_hardening_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
